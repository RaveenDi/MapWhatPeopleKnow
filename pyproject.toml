[project]
name = "map-what-people-know"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic", "shapely", "pyproj", "pillow", "httpx", "python-dotenv", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
